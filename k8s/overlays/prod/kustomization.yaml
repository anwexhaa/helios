apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: helios-prod

resources:
  - ../../base

replicas:
  - name: orion-api
    count: 2
  - name: orion-worker
    count: 2

patches:
  # Production carries the real resource requests. The cluster autoscaler
  # reasons about requests, so these are what decide when a node is added.
  - target:
      kind: Deployment
      name: orion-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
