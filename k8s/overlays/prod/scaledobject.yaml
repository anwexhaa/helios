# KEDA autoscaling for the worker pool. Production only — dev and test have no
# load to scale against, and an autoscaler on an idle environment just adds a
# controller that can be wrong.
#
# Uses the metrics-api scaler, reading queue_size from the application's own
# /stats endpoint.
#
# NOT the `redis` scaler: the queue is a Redis sorted set (zadd/zpopmax/zcard)
# and that scaler measures list length with LLEN, which returns zero against a
# sorted set. It would never scale and never error either, which is worse. See
# decision D6.
#
# NOT the `prometheus` scaler either, although Phase 3 now makes it possible.
# That would make worker scaling depend on the monitoring stack being healthy:
# if Prometheus falls over while the queue is backing up, scaling stops exactly
# when it is needed. See D10.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: orion-worker
  namespace: helios-prod
  labels:
    app.kubernetes.io/part-of: helios
spec:
  scaleTargetRef:
    name: orion-worker

  minReplicaCount: 1
  # 12, derived from measured capacity rather than chosen. A Standard_B2s_v2
  # node has 1900m allocatable; AKS system pods and the monitoring stack take
  # roughly 1180m of that, so about six workers at 150m fill a single node.
  # A ceiling of 12 therefore cannot be satisfied by one node and forces the
  # cluster autoscaler to add the second — which is the behaviour this phase
  # exists to demonstrate. 12 x 150m is 1.8 vCPU, comfortably inside the
  # two-node total.
  maxReplicaCount: 12

  pollingInterval: 15
  # Two minutes before scaling back to minReplicaCount. Long enough that a gap
  # between bursts does not cause a scale-down immediately followed by a
  # scale-up, which costs more in pod startup than the idle capacity saved.
  cooldownPeriod: 120

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # Scale down slowly. Removing a worker mid-job means SIGTERM and a
          # 20-second drain; doing that aggressively trades latency for a
          # saving that lasts seconds.
          stabilizationWindowSeconds: 180
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          # Scale up fast. A backlog is a user waiting.
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15

  triggers:
    - type: metrics-api
      metadata:
        # One replica per 10 queued jobs. At the 12-replica ceiling that is a
        # backlog of 120, which the load test is sized to produce.
        targetValue: "10"
        # Below this, KEDA treats the workload as idle. Set above zero so a
        # single stray job does not hold the pool scaled up.
        activationTargetValue: "3"
        url: "http://orion-api.helios-prod.svc.cluster.local/stats"
        valueLocation: "queue_size"
        format: "json"
