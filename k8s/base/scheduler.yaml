apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-scheduler
  labels:
    app.kubernetes.io/name: orion-scheduler
    app.kubernetes.io/component: scheduler
spec:
  # Exactly one, always. DelayedQueue.poll pushes a due job onto the main
  # queue before removing it from the delayed set, so two schedulers running
  # together requeue the same job twice.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a rolling update would briefly run two
    # schedulers, which is the one thing this component must never do.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-scheduler
        app.kubernetes.io/component: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: orion-queue
          command: ["python", "scheduler_main.py"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: orion-config
          env:
            - name: ORION_ROLE
              value: scheduler
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
