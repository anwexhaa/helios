apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-api
  labels:
    app.kubernetes.io/name: orion-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-api
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: orion-queue
          command: ["python", "api_main.py"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: orion-config
          env:
            - name: ORION_ROLE
              value: api
          # Liveness must not depend on Redis. If it did, a Redis outage would
          # restart every API pod at once and turn a recoverable dependency
          # problem into a full outage.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness does check Redis: a pod that cannot reach it cannot
          # accept a job and should leave the Service until it can.
          readinessProbe:
            # timeoutSeconds 3, above the application's own 1-second Redis
            # timeout. With both at 1s there is no headroom: under slow
            # Redis the kubelet gives up first and reports 'context
            # deadline exceeded', instead of the app answering a clean 503
            # itself. Found in game day 3's re-run: one API probe tipped
            # over at +500ms latency. The kubelet's default is 1s.
            timeoutSeconds: 3
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem is on, and Python still wants somewhere to
        # write.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orion-api
  labels:
    app.kubernetes.io/name: orion-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orion-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orion-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-api
