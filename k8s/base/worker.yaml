apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-worker
  labels:
    app.kubernetes.io/name: orion-worker
    app.kubernetes.io/component: worker
spec:
  # replicas is deliberately ABSENT.
  #
  # In production KEDA owns this field. `kubectl apply` leaves a field alone
  # when it is neither in the manifest nor in last-applied-configuration, so
  # omitting it lets the autoscaler keep its value across deploys. Setting it
  # here would reset the pool on every apply and then let KEDA scale it back
  # up - visible as a scale-down mid-burst for no reason.
  #
  # Kubernetes defaults it to 1 on create. The dev and test overlays set it
  # explicitly, because neither runs KEDA.
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-worker
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # The worker drains on SIGTERM, finishing in-flight jobs rather than
      # dropping them back on the queue. Its grace period is 20s, so give
      # Kubernetes room to let that complete before SIGKILL.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: orion-queue
          command: ["python", "worker_main.py"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: orion-config
          env:
            - name: ORION_ROLE
              value: worker
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # timeoutSeconds 3, above the application's own 1-second Redis
            # timeout. With both at 1s there is no headroom: under slow
            # Redis the kubelet gives up first and reports 'context
            # deadline exceeded', instead of the app answering a clean 503
            # itself. Found in game day 3's re-run: one API probe tipped
            # over at +500ms latency. The kubelet's default is 1s.
            timeoutSeconds: 3
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          resources:
            # Requests are what the cluster autoscaler reasons about. Set them
            # honestly or it cannot decide whether a new node is needed.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
